<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario - Problemas por Molde</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 650px;
            padding: 40px;
        }

        .header {
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            color: #1a202c;
            margin-bottom: 8px;
        }

        .header p {
            color: #718096;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2d3748;
            font-size: 14px;
        }

        .required {
            color: #e53e3e;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input.error, select.error, textarea.error {
            border-color: #e53e3e;
            background-color: #fff5f5;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid;
        }

        .alert.success {
            background: #c6f6d5;
            border-color: #22863a;
            color: #22863a;
            display: block;
        }

        .alert.error {
            background: #fed7d7;
            border-color: #cb2431;
            color: #cb2431;
            display: block;
        }

        .alert.info {
            background: #bee3f8;
            border-color: #1e40af;
            color: #1e40af;
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 15px 0;
        }

        .spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message {
            text-align: center;
            display: none;
        }

        .success-message svg {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            color: #22863a;
        }

        .success-message h2 {
            color: #22863a;
            margin-bottom: 10px;
        }

        .success-message p {
            color: #718096;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Registro de Problemas</h1>
            <p>Sistema SmartMold EP - Problemas por Molde</p>
        </div>

        <div class="alert" id="alert"></div>

        <form id="problemForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="id_molde">ID Molde <span class="required">*</span></label>
                    <input type="number" id="id_molde" name="id_molde" required placeholder="Ej: 90502690">
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha <span class="required">*</span></label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>
            </div>

            <div class="form-group">
                <label for="problema">Problema <span class="required">*</span></label>
                <input type="text" id="problema" name="problema" required placeholder="Ej: Rebaba en línea de partición">
            </div>

            <div class="form-group">
                <label for="diagnostico">Diagnóstico <span class="required">*</span></label>
                <input type="text" id="diagnostico" name="diagnostico" required placeholder="Ej: Exceso de carga">
            </div>

            <div class="form-group">
                <label for="accion">Acción <span class="required">*</span></label>
                <textarea id="accion" name="accion" required placeholder="Describe la acción tomada..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="estado">Estado <span class="required">*</span></label>
                    <select id="estado" name="estado" required>
                        <option value="">Selecciona un estado</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="en_proceso">En Proceso</option>
                        <option value="resuelto">Resuelto</option>
                        <option value="cancelado">Cancelado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="severidad">Severidad <span class="required">*</span></label>
                    <select id="severidad" name="severidad" required>
                        <option value="">Selecciona severidad</option>
                        <option value="baja">Baja</option>
                        <option value="media">Media</option>
                        <option value="alta">Alta</option>
                        <option value="critica">Crítica</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="tecnico">Técnico <span class="required">*</span></label>
                <input type="text" id="tecnico" name="tecnico" required placeholder="Nombre del técnico responsable">
            </div>

            <button type="submit" id="submitBtn">Enviar Reporte</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #718096;">Enviando datos...</p>
        </div>

        <div class="success-message" id="successMessage">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <h2>¡Registro guardado!</h2>
            <p>Los datos se han guardado correctamente en la base de datos.</p>
            <button type="button" onclick="location.reload()" style="margin-top: 20px; background: #22863a;">Nuevo Registro</button>
        </div>
    </div>

    <script>
        // Set today's date as default
        document.getElementById('fecha').valueAsDate = new Date();

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type}`;
        }

        document.getElementById('problemForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = document.getElementById('problemForm');
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const successMessage = document.getElementById('successMessage');

            // Hide previous messages
            document.getElementById('alert').style.display = 'none';
            successMessage.style.display = 'none';

            // Validate form
            const fields = ['id_molde', 'fecha', 'problema', 'diagnostico', 'accion', 'estado', 'severidad', 'tecnico'];
            let isValid = true;

            fields.forEach(fieldId => {
                const field = document.getElementById(fieldId);
                if (!field.value.trim()) {
                    field.classList.add('error');
                    isValid = false;
                } else {
                    field.classList.remove('error');
                }
            });

            if (!isValid) {
                showAlert('⚠️ Por favor completa todos los campos requeridos', 'error');
                return;
            }

            // Show loading
            submitBtn.disabled = true;
            loading.style.display = 'block';

            try {
                // Collect form data
                const formData = {
                    id_molde: document.getElementById('id_molde').value.trim(),
                    fecha: document.getElementById('fecha').value.trim(),
                    problema: document.getElementById('problema').value.trim(),
                    diagnostico: document.getElementById('diagnostico').value.trim(),
                    accion: document.getElementById('accion').value.trim(),
                    estado: document.getElementById('estado').value.trim(),
                    severidad: document.getElementById('severidad').value.trim(),
                    tecnico: document.getElementById('tecnico').value.trim()
                };

                console.log('Sending data:', formData);

                // Send to Google Apps Script
                const SCRIPT_URL = "https://script.googleapis.com/macros/s/AKfycbyne_oj6N5_DxKLBEoboHI3tAGVwZDCP4WnuhB_Jc9XFo8oI3QqeJC80e_FcTp2w24/exec";

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(formData),
                });

                const result = await response.json();
                console.log('Response:', result);

                if (result.success) {
                    // Show success
                    loading.style.display = 'none';
                    form.style.display = 'none';
                    successMessage.style.display = 'block';
                } else {
                    throw new Error(result.error || 'Error desconocido');
                }

            } catch (error) {
                console.error('Error:', error);
                loading.style.display = 'none';
                showAlert('❌ Error: ' + error.message, 'error');
                submitBtn.disabled = false;
            }
        });

        // Remove error class on input change
        document.querySelectorAll('input, select, textarea').forEach(field => {
            field.addEventListener('change', () => {
                field.classList.remove('error');
            });
        });
    </script>
</body>
</html>
