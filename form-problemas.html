<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario - Problemas por Molde</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            padding: 40px;
        }

        .header {
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            color: #1a202c;
            margin-bottom: 8px;
        }

        .header p {
            color: #718096;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2d3748;
            font-size: 14px;
        }

        .required {
            color: #e53e3e;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.success {
            background: #c6f6d5;
            border-left: 4px solid #22863a;
            color: #22863a;
            display: block;
        }

        .alert.error {
            background: #fed7d7;
            border-left: 4px solid #cb2431;
            color: #cb2431;
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Registro de Problemas</h1>
            <p>Problemas por Molde - SmartMold EP</p>
        </div>

        <div class="alert" id="alert"></div>

        <form id="problemForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="id_molde">ID Molde <span class="required">*</span></label>
                    <input type="number" id="id_molde" name="id_molde" required placeholder="Ej: 90502690">
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha <span class="required">*</span></label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>
            </div>

            <div class="form-group">
                <label for="problema">Problema <span class="required">*</span></label>
                <input type="text" id="problema" name="problema" required placeholder="Ej: Rebaba en línea de partición">
            </div>

            <div class="form-group">
                <label for="diagnostico">Diagnóstico <span class="required">*</span></label>
                <input type="text" id="diagnostico" name="diagnostico" required placeholder="Ej: Exceso de carga">
            </div>

            <div class="form-group">
                <label for="accion">Acción <span class="required">*</span></label>
                <textarea id="accion" name="accion" required placeholder="Describe la acción tomada..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="estado">Estado <span class="required">*</span></label>
                    <select id="estado" name="estado" required>
                        <option value="">Selecciona un estado</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="en_proceso">En Proceso</option>
                        <option value="resuelto">Resuelto</option>
                        <option value="cancelado">Cancelado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="severidad">Severidad <span class="required">*</span></label>
                    <select id="severidad" name="severidad" required>
                        <option value="">Selecciona severidad</option>
                        <option value="baja">Baja</option>
                        <option value="media">Media</option>
                        <option value="alta">Alta</option>
                        <option value="critica">Crítica</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="tecnico">Técnico <span class="required">*</span></label>
                <input type="text" id="tecnico" name="tecnico" required placeholder="Nombre del técnico responsable">
            </div>

            <button type="submit">Enviar Reporte</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        // Set today's date as default
        document.getElementById('fecha').valueAsDate = new Date();

        document.getElementById('problemForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = e.target.querySelector('button[type="submit"]');
            const loading = document.getElementById('loading');
            const alert = document.getElementById('alert');

            // Show loading
            submitBtn.disabled = true;
            loading.style.display = 'block';
            alert.style.display = 'none';

            try {
                // Collect form data
                const formData = {
                    id_molde: document.getElementById('id_molde').value,
                    fecha: document.getElementById('fecha').value,
                    problema: document.getElementById('problema').value,
                    diagnostico: document.getElementById('diagnostico').value,
                    accion: document.getElementById('accion').value,
                    estado: document.getElementById('estado').value,
                    severidad: document.getElementById('severidad').value,
                    tecnico: document.getElementById('tecnico').value
                };

                const SCRIPT_URL = "https://script.googleapis.com/macros/s/AKfycbw4bP36F2qWvAafOaElC0XWZeu1MHXdDo-3bUa4CjW-vBb2D3Tv3S4SJq5-qnQrcHrl/exec";

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(formData),
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (result.success) {
                    alert.className = 'alert success';
                    alert.textContent = '✓ ' + result.message;
                    document.getElementById('problemForm').reset();
                    document.getElementById('fecha').valueAsDate = new Date();
                } else {
                    alert.className = 'alert error';
                    alert.textContent = '✗ Error: ' + result.error;
                }
            } catch (error) {
                alert.className = 'alert error';
                alert.textContent = '✗ Error al enviar: ' + error.message;
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
